r metadata with each chunk.\nHow should you configure the ingestion job?", "options": [{"key": "A", "text": "Use advanced data parsing to reingest the documents."}, {"key": "B", "text": "Use OCR and page-level chunking."}, {"key": "C", "text": "Use page-level OCR extraction and store each page as a single chunk."}, {"key": "D", "text": "Use basic parsing and fixed-size chunking."}], "suggestedAnswer": "A", "communityAnswer": "A  [A 4 (100%)]", "images": []}, {"number": 55, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412487-exam-ai-103-topic-1-question-55-discussion/", "content": "You have a Microsoft Foundry project that contains an agent.\nThe agent uses Azure AI Search as the retriever.\nYou plan to ingest PDF into an Azure AI Search index to ensure that the agent can ground responses in texts in both documents and embedded images.\nUsers require citations that link to the source files.\nYou need to ensure that during indexing, the images are extracted into a structure that can be used as input for the built-in optical character recognition (OCR) skill.\nWhich indexing approach should you use?", "options": [{"key": "A", "text": "an indexer to extract image data into a normalized_images collection"}, {"key": "B", "text": "a Shaper skill to restructure the OCR input"}, {"key": "C", "text": "a skillset to run the OCR skill directly against the content field of the index"}, {"key": "D", "text": "the outputFieldMappings parameter to write image data to a searchable field"}], "suggestedAnswer": "A", "communityAnswer": "A  [A 2 (100%)]", "images": []}, {"number": 56, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412488-exam-ai-103-topic-1-question-56-discussion/", "content": "Case Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to recommend an invoice review solution that resolves the issue reported by the finance department.\nWhat should you include in the recommendation?", "options": [{"key": "A", "text": "chat completions"}, {"key": "B", "text": "Azure Document Intelligence in Foundry Tools"}, {"key": "C", "text": "Azure Content Understanding in Foundry Tools"}, {"key": "D", "text": "Image Analysis"}], "suggestedAnswer": "C", "communityAnswer": "C  [C 6 (100%)]", "images": []}, {"number": 57, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412489-exam-ai-103-topic-1-question-57-discussion/", "content": "You have a Microsoft Foundry project that contains an agent.\nThe knowledge source for the agent is a set of scanned PDF troubleshooting guides stored in Azure Blob Storage. The guide pages contain two-column layouts and tables.\nYou use Azure Content Understanding in Foundry Tools to process the PDFs.\nYou plan to ingest the processed content into an index for Retrieval Augmented Generation (RAG) and store extracted fields for downstream automation.\nStakeholders must be able to verify where each extracted field value came from in the original PDF and route low-reliability extractions for manual review.\nYou need to ensure that the Content Understanding document analyzer output includes a per-field confidence score and source grounding to locations within the source document.\nWhat should you do?", "options": [{"key": "A", "text": "Set enableSegment to true."}, {"key": "B", "text": "Provide labeled samples."}, {"key": "C", "text": "Enable estimateFieldSourceAndConfidence."}, {"key": "D", "text": "Configure the analyzer to use generative extraction for all fields."}], "suggestedAnswer": "C", "communityAnswer": "C  [C 2 (100%)]", "images": []}, {"number": 58, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412490-exam-ai-103-topic-1-question-58-discussion/", "content": "You are building a speech processing solution in Microsoft Foundry for a customer support platform.\nThe platform will transcribe live phone calls, so that supervisors at your company can view call transcripts and detect issues while the calls are in progress. The call audio will arrive as a continuous stream from the telephony system.\nYou need to ensure that the call transcripts appear within only a few seconds of the audio stream.\nWhat should you do?", "options": [{"key": "A", "text": "Use text to speech by using a custom neural voice."}, {"key": "B", "text": "Use speech translation to generate the transcripts into multiple languages."}, {"key": "C", "text": "Run a batch transcription job on recorded audio files."}, {"key": "D", "text": "Use real-time speech to text to process streaming audio input."}], "suggestedAnswer": "D", "communityAnswer": "D  [D 1 (100%)]", "images": []}, {"number": 59, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412491-exam-ai-103-topic-1-question-59-discussion/", "content": "You are creating an agent workflow in a Microsoft Foundry project to support natural voice interactions.\nThe agent must receive continuous audio input, convert the input into text for reasoning, and then return spoken responses to a user. The workflow must meet the following requirements:\nSupport turn-taking dynamics, where the agent begins to generate the speech output before the user finishes speaking.\nOperate with low latency to maintain conversational experience.\nYou need to enable both speech to text and text to speech in a real-time agent interaction.\nWhat should you do?", "options": [{"key": "A", "text": "Use batch transcription to convert the audio input and return text responses from the agent."}, {"key": "B", "text": "Use real-time speech to text for incoming audio and text to speech for agent responses."}, {"key": "C", "text": "Use an embeddings model to encode the audio, and then decode the audio into text and speech."}, {"key": "D", "text": "Use speech translation to convert the audio into another language and return the translated text."}], "suggestedAnswer": "B", "communityAnswer": "B  [B 1 (100%)]", "images": []}, {"number": 60, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412492-exam-ai-103-topic-1-question-60-discussion/", "content": "You have an application named App1 that uses Azure Speech in Foundry Tools to transcribe live calls.\nTranscript segments often contain both English and Spanish. App1 sends each segment to Azure Translator in Foundry Tools to translate to another language.\nSometimes, mixed-language segments result in incomplete or incorrect translations.\nYou need to reduce translation errors. The solution must ensure that the entire transcript is translated successfully.\nWhat should you do before sending the segments to Translator?", "options": [{"key": "A", "text": "Use document translation to translate the entire transcript as a single document."}, {"key": "B", "text": "Split the mixed-language segments into single-language segments and translate each segment separately."}, {"key": "C", "text": "Enable automatic language detection for the translation request."}, {"key": "D", "text": "Specify English as the source language in the translation request for all the segments."}], "suggestedAnswer": "B", "communityAnswer": "B  [B 1 (100%)]", "images": []}, {"number": 61, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412493-exam-ai-103-topic-1-question-61-discussion/", "content": "Case Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” bu oduct sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to recommend a solution to support the planned changes and technical requirements for Agent1 to use the product information stored in storage1.\nWhat should you include in the recommendation?", "options": [{"key": "A", "text": "Azure Translator in Foundry Tools"}, {"key": "B", "text": "Grounding with Bing Search"}, {"key": "C", "text": "Azure AI Search"}, {"key": "D", "text": "Azure Document intelligence in Foundry Tools"}], "suggestedAnswer": "C", "communityAnswer": "C  [C 2 (100%)]", "images": []}, {"number": 63, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412495-exam-ai-103-topic-1-question-63-discussion/", "content": "You have a Microsoft Foundry project named Project1.\nProject1 contains an application that processes PDF vendor invoices.\nYou need to configure Azure Document Intelligence in Foundry Tools to generate a Markdown output that preserves the sections and table structure of the PDFs. The solution must minimize development effort.\nWhat should you do?", "options": [{"key": "A", "text": "Configure output=figures when you analyze the PDF."}, {"key": "B", "text": "Configure content=markdown when you analyze the document."}, {"key": "C", "text": "Increase the confidence threshold."}, {"key": "D", "text": "Set the output_content_format=ContentFormat.MARKDOWN value."}], "suggestedAnswer": "D", "communityAnswer": "D  [D 2 (100%)]", "images": []}, {"number": 64, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412496-exam-ai-103-topic-1-question-64-discussion/", "content": "You have a Microsoft Foundry project that ingests scanned PDF invoices stored in Azure Blob Storage. Each invoice contains printed fine items and has a table-based layout.\nExtracted results are stored as structured JSON and used as grounding data for an agent in a Retrieval Augmented Generation (RAG) solution.\nYou need to create a single analyzer that meets the following requirements:\nExtracts the invoice number, invoice date, vendor name, and total amount across varying templates\nReturns confidence scores so that results with confidence below 0.80 can be routed for supervisor review\nWhat should you use?", Microsoft Entra tenant ID"}], "suggestedAnswer": "A", "communityAnswer": "B  [B 2 (100%)]", "images": []}, {"number": 97, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/421543-exam-ai-103-topic-1-question-97-discussion/", "content": "You have a Microsoft Foundry project.\nYou need to deploy a model from the model catalog to support real-time inference. The solution must meet the following requirements:\n• Use key-based authentication.\n• Support real-time REST API access.\n• NOT consume the vCPU quota of the virtual machines in the Azure subscription.\nWhich type of deployment should you use?", "options": [{"key": "A", "text": "serverless API"}, {"key": "B", "text": "batch"}, {"key": "C", "text": "self-hosted container"}, {"key": "D", "text": "standard"}], "suggestedAnswer": "D", "communityAnswer": "A  [A 2 (100%)]", "images": []}, {"number": 103, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/421549-exam-ai-103-topic-1-question-103-discussion/", "content": "HOTSPOT\n-\nYou have an Azure subscription.\nYou need to create a new resource that will generate fictional stores in response to user prompts. The solution must ensure that the resource uses a customer-managed key to protect data.\nHow should you complete the script? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image62.png"]}, {"number": 112, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/421558-exam-ai-103-topic-1-question-112-discussion/", "content": "DRAG DROP\n-\nYou have a web app that uses Azure AI Search.\nWhen reviewing activity you see greater than expected search query volumes. You suspect that the query key is compromised.\nYou need to prevent unauthorized access to the search endpoint and ensure that users only have read only access to the documents collection. The solution must minimize app downtime.\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image71.png"]}, {"number": 117, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/421563-exam-ai-103-topic-1-question-117-discussion/", "content": "HOTSPOT\n-\nYou are creating an enrichment pipeline that will use Azure AI Search. The knowledge store contains unstructured JSON data and the text from scanned PDF documents.\nWhich projection type should you use for each data type? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image78.png"]}, {"number": 121, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/424413-exam-ai-103-topic-1-question-121-discussion/", "content": "HOTSPOT\n-\nYou are building a solution that students will use to find references for essays.\nYou use the following code to start building the solution.\n\nFor each of the following statements, select Yes is the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image84.png", "https://img.examtopics.com/ai-103/image85.png"]}, {"number": 130, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/424418-exam-ai-103-topic-1-question-130-discussion/", "content": "HOTSPOT\n-\nYou run the following command.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image94.png", "https://img.examtopics.com/ai-103/image95.png"]}, {"number": 132, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/424409-exam-ai-103-topic-1-question-132-discussion/", "content": "You are building an app that will include one million scanned magazine articles. Each article will be stored as an image file.\nYou need to configure the app to extract text from the images. The solution must minimize development effort.\nWhat should you include in the solution?", "options": [{"key": "A", "text": "Azure Document Intelligence in Foundry Tools"}, {"key": "B", "text": "the Read API in Azure Vision in Foundry Tools"}, {"key": "C", "text": "Azure Vision in Foundry Tools Image Analysis"}, {"key": "D", "text": "Azure Language in Foundry Tools"}], "suggestedAnswer": "B", "communityAnswer": "A  [A 1 (100%)]", "images": []}, {"number": 133, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/424410-exam-ai-103-topic-1-question-133-discussion/", "content": "DRAG DROP\n-\nYou are building an app that will scan confidential documents and use the Azure Language in Foundry Tools service to analyze the contents.\nYou provision a Microsoft Foundry Service resource.\nYou need to ensure that the app can make requests to the Azure Language in Foundry Tools service endpoint. The solution must ensure that confidential documents remain on-premises.\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image97.png"]}];

</script>
<script>
(()=>{
 const bank=new Map((window.AI103_QUESTIONS||[]).map(q=>[q.number,q]));
 const key='ai103-quiz-state-v1';
 let state={mode:'learn',current:1,answers:{},flagged:{},filter:'all'};
 try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}
 const $=id=>document.getElementById(id), nav=$('nav'), card=$('quizCard');
 const isScoreable=q=>q&&q.options&&q.options.length>=2&&/^[A-D]$/.test(q.suggestedAnswer||'');
 const isVisual=q=>q&&(!isScoreable(q))&&(q.images?.length>0||/HOTSPOT|DRAG DROP/i.test(q.content||''));
 const save=()=>localStorage.setItem(key,JSON.stringify(state));
 function stats(){
   const supplied=[...bank.values()].length, scoreable=[...bank.values()].filter(isScoreable).length;
   const entries=Object.values(state.answers||{}).filter(x=>x&&x.submitted); const correct=entries.filter(x=>x.correct).length;
   $('availableCount').textContent=supplied; $('scoreableCount').textContent=scoreable; $('answeredCount').textContent=entries.length; $('accuracy').textContent=entries.length?Math.round(correct/entries.length*100)+'%':'—';
 }
 function visible(n){const q=bank.get(n),a=state.answers[n];switch(state.filter){case'supplied':return!!q;case'scoreable':return isScoreable(q);case'visual':return isVisual(q);case'missing':return!q;case'flagged':return!!state.flagged[n];case'wrong':return a?.submitted&&!a.correct;default:return true}}
 function renderNav(){nav.innerHTML='';for(let n=1;n<=135;n++){if(!visible(n))continue;const q=bank.get(n),a=state.answers[n];const b=document.createElement('button');b.className='qnav';b.textContent=n;b.title=q?`Question ${n}`:`Question ${n}: not supplied`;if(!q)b.classList.add('missing');else if(isVisual(q))b.classList.add('visual');if(a?.submitted)b.classList.add(a.correct?'correct':'wrong');if(state.flagged[n])b.classList.add('flagged');if(n===state.current)b.style.outline='2px solid var(--accent)';b.addEventListener('click',()=>{state.current=n;save();render()});nav.appendChild(b)}}
 function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
 function link(q){return q?.url?`<a href="${esc(q.url)}" target="_blank" rel="noopener">Open source discussion</a>`:''}
 function answerPanel(q,a){if(!q)return'';if(isScoreable(q)){
   if(state.mode==='learn'||a?.submitted){return `<div class="answerbox"><h3>Answer key</h3><p><span class="good">Suggested answer: ${esc(q.suggestedAnswer)}</span></p>${q.communityAnswer?`<p>Community answer: ${esc(q.communityAnswer)}</p>`:''}<p class="source-note">This app preserves the answer key exactly as supplied in your source. It does not silently resolve disputed community answers.</p></div>`}return''
 }
 return `<div class="answerbox"><h3>Source limitation</h3><p class="warn">The supplied text does not include a machine-readable answer key for this visual/interactive item.</p>${q.images?.length?`<p>The source references ${q.images.length} image${q.images.length>1?'s':''}; those images are not copied into this hosted app.</p>`:''}</div>`
 }
 function renderQuestion(q,n){const a=state.answers[n]||{};let opts='';if(q.options?.length){opts='<div class="opts">'+q.options.map(o=>{let cls='opt';if(a.choice===o.key)cls+=' selected';if(state.mode==='learn'&&isScoreable(q)&&o.key===q.suggestedAnswer)cls+=' correct';if(a.submitted&&isScoreable(q)){if(o.key===q.suggestedAnswer)cls+=' correct';else if(o.key===a.choice)cls+=' wrong'}return `<button class="${cls}" data-choice="${o.key}"><span class="letter">${o.key}</span><span>${esc(o.text)}</span></button>`}).join('')+'</div>'}
 const submit=(state.mode==='test'&&isScoreable(q))?`<button class="btn primary" id="submitBtn" ${a.choice?'':'disabled'}>${a.submitted?'Update answer':'Submit answer'}</button>`:'';
 card.innerHTML=`<div class="qhead"><div><div class="eyebrow">Topic ${q.topic||1} · Question ${n} of 135</div><h2 class="qtitle">AI-103 Practice Question</h2></div><div class="actions"><button class="btn flag ${state.flagged[n]?'on':''}" id="flagBtn">${state.flagged[n]?'★ Flagged':'☆ Flag'}</button>${link(q)}</div></div><div class="question">${esc(q.content||'')}</div>${q.images?.length?`<div class="source-note">This question references a visual answer area in the original source. For copyright and accuracy, the external image is not republished here. Use the source discussion link if you need the visual.</div>`:''}${opts}${answerPanel(q,a)}<div class="controls"><button class="btn" id="prevBtn">← Previous</button><div>${submit}</div><button class="btn" id="nextBtn">Next →</button></div>`;
 card.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{if(state.mode==='test'&&a.submitted)return;state.answers[n]={...(state.answers[n]||{}),choice:b.dataset.choice,submitted:state.mode==='learn'?false:(state.answers[n]?.submitted||false)};save();render()}));
 $('flagBtn').addEventListener('click',()=>{state.flagged[n]=!state.flagged[n];save();render()});$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
 const sb=$('submitBtn');if(sb)sb.addEventListener('click',()=>{const cur=state.answers[n];if(!cur?.choice)return;cur.submitted=true;cur.correct=cur.choice===q.suggestedAnswer;save();render()})
 }
 function renderMissing(n){card.innerHTML=`<div class="locked"><div class="eyebrow">Question ${n} of 135</div><h2>Question not supplied yet</h2><p>Your uploaded bank does not contain Q${n}. This slot is deliberately left empty so the app does not invent or misnumber an ExamTopics question.</p><div class="controls"><button class="btn" id="prevBtn">← Previous</button><button class="btn" id="nextBtn">Next →</button></div></div>`;$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1))}
 function move(d){let n=state.current;for(let i=0;i<135;i++){n+=d;if(n<1)n=135;if(n>135)n=1;if(visible(n)){state.current=n;save();render();return}}}
 function render(){stats();renderNav();const q=bank.get(state.current);q?renderQuestion(q,state.current):renderMissing(state.current);$('learnBtn').classList.toggle('active',state.mode==='learn');$('testBtn').classList.toggle('active',state.mode==='test');$('filter').value=state.filter}
 $('reviewBtn').addEventListener('click',()=>{state.filter='wrong';const nums=Object.keys(state.answers||{}).map(Number).filter(n=>state.answers[n]?.submitted&&!state.answers[n]?.correct);if(nums.length)state.current=nums[0];save();render()});$('learnBtn').addEventListener('click',()=>{state.mode='learn';save();render()});$('testBtn').addEventListener('click',()=>{state.mode='test';save();render()});$('filter').addEventListener('change',e=>{state.filter=e.target.value;if(!visible(state.current)){for(let n=1;n<=135;n++)if(visible(n)){state.current=n;break}}save();render()});$('resetBtn').addEventListener('click',()=>{if(confirm('Reset all answers and flags?')){state.answers={};state.flagged={};save();render()}});
 render();
})();
</script>
