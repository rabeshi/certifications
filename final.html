window.AI103_QUESTIONS = [{"number": 1, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412433-exam-ai-103-topic-1-question-1-discussion/", "content": "HOTSPOT -\nCase Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to configure the model deployment for Agent1 to meet the technical requirements.\nWhat should you configure? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image1.png"]}, {"number": 2, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412434-exam-ai-103-topic-1-question-2-discussion/", "content": "Case Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to configure Agent1 to meet the security and compliance requirements.\nWhat should you use?", "options": [{"key": "A", "text": "self-harm content filtering"}, {"key": "B", "text": "prompt shields"}, {"key": "C", "text": "Personally identifiable information (PII) Detection"}, {"key": "D", "text": "violence content filtering"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 13 (52%), C 12 (48%)]", "images": []}, {"number": 3, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412435-exam-ai-103-topic-1-question-3-discussion/", "content": "You are planning a Microsoft Foundry project named Project1 that will contain multiple agents. Each agent will access the same Azure AI Search resource.\nYou need to recommend a solution to centrally manage the Azure AI Search credentials within Project1. The solution must be implemented across all the agents.\nWhat should you recommend?", "options": [{"key": "A", "text": "Enable role-based access control (RBAC) for the Azure AI Search resource."}, {"key": "B", "text": "Disable key-based access control on the Azure AI Search resource."}, {"key": "C", "text": "Add a connection to the Azure AI Search resource."}, {"key": "D", "text": "Create a managed private endpoint that connects to the Azure AI Search resource."}], "suggestedAnswer": "C", "communityAnswer": "C  [C 2 (100%)]", "images": []}, {"number": 4, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412436-exam-ai-103-topic-1-question-4-discussion/", "content": "HOTSPOT -\nYour company is piloting a customer support agent in a Microsoft Foundry project name Project1. Project1 is connected to an existing Application Insights resource, and the company’s support team reviews runs in the Traces tab.\nThe Foundry Agent Service is configured to perform the following actions:\nRetrieve the Application Insights connection string by calling project_client.telemetry.get_application_insights_connection_string().\nCall configure_azure_monitor(connection_string=...) to enable telemetry.\nA separate LangChain service is configured to use OpenTelemetry and has the following configurations:\nUses AzureAIOpenTelemetryTracer(connection_string=..., enable_content_recording=False)\nPasses the tracer by using config={“callbacks”:[azure_tracer]}\nCompany policy has the following requirements:\nTelemetry from LangChain and OpenTelemetry must be distinguishable within the same Application Insights resource.\nSecrets and credentials must NOT be stored in prompts, tool arguments, or span attributes.\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image3.png"]}, {"number": 5, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412437-exam-ai-103-topic-1-question-5-discussion/", "content": "DRAG DROP -\nYou have a Microsoft Foundry project that processes procurement documents submitted by suppliers.\nYou need to implement two pipelines by using Azure Content Understanding in Foundry Tools. The solution must meet the following requirements:\nInclude a pipeline named Pipeline1 that supports cost-effective, high-volume processing of standalone PDF invoices.\nInclude a pipeline named Pipeline2 that supports cross-document validation by using multi-step reasoning and reference data.\nHow should you configure each pipeline? To answer, drag the appropriate configurations to the correct pipelines. Each configuration may be used once, more than once, of not at all. You may need to drag the split bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image5.png"]}, {"number": 6, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412438-exam-ai-103-topic-1-question-6-discussion/", "content": "HOTSPOT -\nYou have a Python application named App1 that integrates with a Microsoft Foundry project named Project1.\nYou need to ensure that App1 meets the following requirements:\nAuthenticates by using a Microsoft Entra managed identity\nSends prompts to a deployed model by using the Azure OpenAI Responses API\nHow should you complete the Python code? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image7.png"]}, {"number": 7, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412439-exam-ai-103-topic-1-question-7-discussion/", "content": "HOTSPOT -\nYou have a Microsoft Foundry project that contains a workflow for a customer support triage process.\nYou have an Ask a question node that stores user responses in a local variable named Var01.\nYou need to create the following Power Fx expressions:\nAn if/else condition expression that ensures that Var01 contains a value\nA Send message expression that returns the stored user response in uppercase\nHow should you configure the expressions? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image9.png"]}, {"number": 8, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412440-exam-ai-103-topic-1-question-8-discussion/", "content": "HOTSPOT -\nYou have a Microsoft Foundry project that contains a customer support agent built by using the Foundry Agent Service.\nThe agent uploads user-provided screenshots to Azure Storage through a ticketing tool and receives a blob URL for additional reasoning.\nYou need to use image moderation during agent runs and prevent harmful content from being returned during runs. Azure AI Content Safety must access the images by using the blob URL. The solution must follow the principle of least privilege.\nWhat should you configure for Content Safety? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image11.png"]}, {"number": 9, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412441-exam-ai-103-topic-1-question-9-discussion/", "content": "You have a Microsoft Foundry project that contains three agents as shown in the following table.\n\nYou need to orchestrate the agents to ensure that the customer requests meet the following requirements:\nSupport a deterministic, step-based process that uses conditional branching and shared state across the agents.\nOptionally trigger a ticket action based on the triage result.\nThe solution must minimize development effort.\nWhat should you include in the solution?", "options": [{"key": "A", "text": "a workflow"}, {"key": "B", "text": "threads and runs without a workflow"}, {"key": "C", "text": "a multi-agent group chat session"}, {"key": "D", "text": "separate agent runs coordinated in the application code"}], "suggestedAnswer": "A", "communityAnswer": "A  [A 2 (100%)]", "images": ["https://img.examtopics.com/ai-103/image13.png"]}, {"number": 10, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412442-exam-ai-103-topic-1-question-10-discussion/", "content": "You have a Microsoft Foundry project that contains an agent. The agent uses Azure Speech in Foundry Tools.\nYou fine-tune a baseline speech to text model for the en-us locale and publish the model.\nThe agent calls the Speech to text REST API and returns an error message indicating that the project ID is invalid.\nYou need to set the project property to the correct ID.\nTo what should you set the project property?", "options": [{"key": "A", "text": "the project URL"}, {"key": "B", "text": "the custom speech project ID"}, {"key": "C", "text": "the project ID"}, {"key": "D", "text": "the custom speech endpoint URL"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 4 (100%)]", "images": []}, {"number": 11, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412443-exam-ai-103-topic-1-question-11-discussion/", "content": "HOTSPOT -\nYou have a Microsoft Foundry project that contains an agent named PaymentAgent.\nPaymentAgent includes a function tool that issues customer refunds by using an external API.\nYou are creating a workflow in YAML.\nYou need to ensure that the workflow pauses for human approval and continues with the refund step only after approval is granted.\nHow should you complete the workflow definition? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image14.png"]}, {"number": 12, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412444-exam-ai-103-topic-1-question-12-discussion/", "content": "You have an Azure Speech in Foundry Tools resource that hosts a custom speech to text model deployed to a custom endpoint. An agent uses the endpoint to perform real-time speech recognition.\nYou are approaching the expiration date of the custom speech to text model.\nWhat is the expected behavior when the model expires?", "options": [{"key": "A", "text": "Speech recognition requests will return a 4xx error until a new custom model is deployed."}, {"key": "B", "text": "Speech recognition requests will continue to use the expired custom model until the model is removed manually."}, {"key": "C", "text": "Speech recognition requests will fall back to the most recent base model for the same locale."}, {"key": "D", "text": "The custom model will be deleted automatically when the model expires."}], "suggestedAnswer": "C", "communityAnswer": "C  [C 7 (87%), A 1 (12%)]", "images": []}, {"number": 13, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412445-exam-ai-103-topic-1-question-13-discussion/", "content": "You have a Microsoft Foundry project that contains a model deployment.\nYou have an application that calls the deployment by using the Azure OpenAI v1 API and DefaultAzureCredential.\nThe developers at your company receive HTTP 403 errors when they send inference requests, even after running az login.\nYou need to ensure that the developers can perform model inference. The solution must follow the principle of least privilege.\nWhich role-based access control (RBAC) role should you assign to the developers?", "options": [{"key": "A", "text": "Cognitive Services User"}, {"key": "B", "text": "Cognitive Services OpenAI User"}, {"key": "C", "text": "Contributor"}, {"key": "D", "text": "Cognitive Services Data Reader"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 3 (100%)]", "images": []}, {"number": 14, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412446-exam-ai-103-topic-1-question-14-discussion/", "content": "You have a Microsoft Foundry project that contains an agent. The agent has a Model Context Protocol (MCP) tool that queries a knowledge base stored in Azure AI Search.\nSome agent runs return answers from the base model without invoking the knowledge base, which results in responses without grounded citations.\nYou are provided with the following code snippet that runs the agent.\n\nYou need to add the correct tool _choice parameter to the code to deterministically force the agent to invoke the MCP tool on each run.\nWhat should you add?", "options": [{"key": "A", "text": "tool_choice={“required”}"}, {"key": "B", "text": "tool_choice={“auto”}"}, {"key": "C", "text": "tool_choice={“type”:“knowledge_base”}"}, {"key": "D", "text": "tool_choice ={“type”:“mcp”}"}], "suggestedAnswer": "A", "communityAnswer": "A  [A 8 (57%), D 6 (42%)]", "images": ["https://img.examtopics.com/ai-103/image16.png"]}, {"number": 15, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412447-exam-ai-103-topic-1-question-15-discussion/", "content": "DRAG DROP -\nYou have a Microsoft Foundry project that contains a customer support agent grounded in internal documentation.\nAfter a recent update, users report the following issues:\nSome answers are unsupported by retrieved documents.\nA small number of responses are flagged for policy violations.\nYou need to evaluate each issue.\nWhich observability signals should you use for each issue? To answer, drag the appropriate observability signals to the correct issues. Each observability signal may be used once, more than once, or not at all. You may need to drag the spit bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image17.png"]}, {"number": 16, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412448-exam-ai-103-topic-1-question-16-discussion/", "content": "You have a Microsoft Foundry project named Project1 that contains an agent. The agent uses an OpenAPI 3.0 specification to call an external weather service.\nThe weather service requires a key to be passed in an HTTP header. The key value is stored as a connection in Project1.\nYou need to ensure that the key value from the connection is included automatically whenever the OpenAPI tool is invoked.\nWhat should you configure in the OpenAPI specification?", "options": [{"key": "A", "text": "a header parameter defined for each operation"}, {"key": "B", "text": "an Azure Key Vault connection"}, {"key": "C", "text": "an API key security scheme"}, {"key": "D", "text": "a Bearer token security scheme"}], "suggestedAnswer": "C", "communityAnswer": "C  [C 1 (100%)]", "images": []}, {"number": 17, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412449-exam-ai-103-topic-1-question-17-discussion/", "content": "You have a Microsoft Foundry project that serves a high-volume chat app.\nMost requests are simple FAQs, but some require advanced reasoning.\nYou need to reduce costs and latency for common queries, without degrading the quality of the responses to complex questions.\nWhat should you do?", "options": [{"key": "A", "text": "Route all the requests to a smaller model."}, {"key": "B", "text": "Use a model cascade that routes the requests to different models."}, {"key": "C", "text": "Increase the value of the max_tokens parameter for all the requests."}, {"key": "D", "text": "Route all the requests to the most capable model."}], "suggestedAnswer": "B", "communityAnswer": "B  [B 2 (100%)]", "images": []}, {"number": 19, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412451-exam-ai-103-topic-1-question-19-discussion/", "content": "You have a Microsoft Foundry project that contains a high-traffic agent.\nAfter a recent update, operational costs increase significantly.\nMonitoring confirms that the volume of user traffic to the agent remains unchanged.\nYou suspect that changes to the request or response characteristics are causing the increase. You need to identify whether the additional costs are driven by the model input size, the model output size, or expanded tool usage.\nWhich observability capability should you use?", "options": [{"key": "A", "text": "latency"}, {"key": "B", "text": "evaluation metrics"}, {"key": "C", "text": "run success rate"}, {"key": "D", "text": "token usage"}], "suggestedAnswer": "D", "communityAnswer": "D  [D 1 (100%)]", "images": []}, {"number": 20, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412452-exam-ai-103-topic-1-question-20-discussion/", "content": "HOTSPOT -\nYou have a Microsoft Foundry project that contains an agent.\nThe agent uses tools to retrieve internal content and call external APIs. The agent is configured to let the model decide when to call the tools.\nYou need to publish the agent for a compliance workflow. The solution must meet the following requirements:\nEach workflow run must include a retrieval step before generating a response.\nTool calls must authenticate by using the published agent’s own identity.\nTool access must use an identity isolated from other project resources.\nTool access must use support audit tracing.\nWhat should you do? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image21.png"]}, {"number": 21, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412453-exam-ai-103-topic-1-question-21-discussion/", "content": "You have a Microsoft Foundry project named Project1 that contains the following:\nAn OpenAPI tool that calls an external API\nA project connection named Connection1 that stores the API key of the external API\nWhen an agent calls the OpenAPI tool, the API returns a 401 unauthorized error, and traces show that the API key header is NOT being sent.\nYou need to ensure that the OpenAPI tool automatically includes the API key from Connection1 on all requests.\nWhat should you do?", "options": [{"key": "A", "text": "Enable identity passthrough so that the tool uses the Microsoft Entra token of the caller."}, {"key": "B", "text": "Add the API key header manually to the OpenAPI specification."}, {"key": "C", "text": "Configure the tool to use the default connection of Project1."}, {"key": "D", "text": "Connect the tool to Connection1."}], "suggestedAnswer": "D", "communityAnswer": "D  [D 4 (100%)]", "images": []}, {"number": 22, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412454-exam-ai-103-topic-1-question-22-discussion/", "content": "You have a Microsoft Foundry project that contains a customer support agent. The agent calls an internal knowledge API tool before generating responses.\nUsers report the following issues:\nSome requests take more than 15 seconds to complete.\nSome responses are incorrect, even when the knowledge API returns the expected data.\nYou need to inspect individual agent runs to view the ordered sequence of large language model (LLM) calls, tool invocations, and timing information.\nWhich observability capability should you use?", "options": [{"key": "A", "text": "token usage"}, {"key": "B", "text": "monitoring"}, {"key": "C", "text": "safety metrics"}, {"key": "D", "text": "tracing"}], "suggestedAnswer": "D", "communityAnswer": "D  [D 1 (100%)]", "images": []}, {"number": 23, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412455-exam-ai-103-topic-1-question-23-discussion/", "content": "Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses.\nYou discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model.\nYou need to implement controls to mitigate the risk.\nSolution: You configure a prompt shield for user prompts.\nDoes this meet the goal?", "options": [{"key": "A", "text": "Yes"}, {"key": "B", "text": "No"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 5 (83%), A 1 (16%)]", "images": []}, {"number": 24, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412456-exam-ai-103-topic-1-question-24-discussion/", "content": "Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses.\nYou discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model.\nYou need to implement controls to mitigate the risk.\nSolution: You configure image moderation to block unsafe content before processing the images.\nDoes this meet the goal?", "options": [{"key": "A", "text": "Yes"}, {"key": "B", "text": "No"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 7 (100%)]", "images": []}, {"number": 25, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412457-exam-ai-103-topic-1-question-25-discussion/", "content": "Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses.\nYou discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model.\nYou need to implement controls to mitigate the risk.\nSolution: You configure a prompt shield for documents.\nDoes this meet the goal?", "options": [{"key": "A", "text": "Yes"}, {"key": "B", "text": "No"}], "suggestedAnswer": "A", "communityAnswer": "A  [A 6 (54%), B 5 (45%)]", "images": []}, {"number": 26, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412458-exam-ai-103-topic-1-question-26-discussion/", "content": "Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses.\nYou discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model.\nYou need to implement controls to mitigate the risk.\nSolution: You configure protected material detection.\nDoes this meet the goal?", "options": [{"key": "A", "text": "Yes"}, {"key": "B", "text": "No"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 3 (100%)]", "images": []}, {"number": 27, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412459-exam-ai-103-topic-1-question-27-discussion/", "content": "Case Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to recommend a solution to assess the responses generated by Agent1 when the agent uses the product information stored in storage1. The solution must meet the technical requirements.\nWhat should you include in the recommendation?", "options": [{"key": "A", "text": "a Retrieval Augmented Generation (RAG) evaluator"}, {"key": "B", "text": "a custom guardrail"}, {"key": "C", "text": "model fine-tuning"}, {"key": "D", "text": "a groundedness evaluator"}], "suggestedAnswer": "D", "communityAnswer": "D  [D 3 (100%)]", "images": []}, {"number": 28, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412460-exam-ai-103-topic-1-question-28-discussion/", "content": "Case Study -\nThis is a case study. Case studies are not timed separately from other exam sections. You can use as much exam time as you would like to complete each case study. However, there might be additional case studies or other exam sections. Manage your time to ensure that you can complete all the exam sections in the time provided. Pay attention to the Exam Progress at the top of the screen so you have sufficient time to complete any exam sections that follow this case study.\nTo answer the case study questions, you will bed to reference information that is provided in the case. Case studies and associated questions might contain exhibits or other resources that provide more information about the scenario described in the case. Information provided in an individual question does not apply to the other questions in the case study.\nA Review Screen will appear at the end of this case study. From the Review Screen, you can review and change your answers before you move to the next exam section. After you leave this case study, you will NOT be able to return to it.\nTo start the case study -\nTo display the first question in this case study, select the “Next” button. To the left of the question, a menu provides links to information such as business requirements, the existing environment, and problem statements. Please read through all this information before answering any questions. When you are ready to answer a question, select the “Question” button to return to the question.\nOverview -\nCompany Information -\nContoso, Ltd is a multinational retail company that builds, deploys, and manages generative AI and agent-based solutions by using Microsoft Foundry.\nExisting Environment -\nIdentity Environment -\nContoso uses Microsoft Entra ID for identity management, authentication, and authorization capabilities that enable agents to access organizational resources and services.\nContoso recently formed a new AI engineering team named Agent1Dev Team to optimize and maintain existing AI solutions.\nThe team collaborates with solution architects, DevOps engineers, and security engineers to design, implement. monitor, and secure AI applications.\nContoso also has a team named Agent1Test Team that is responsible for validating AI solutions before the solution deployments.\nGenerative Environment -\nContoso has a Microsoft Foundry deployment that contains two projects named Project1 and Project2.\nProject1 -\nProject1 contains a customer support agent named Agent1 that assists customers with product inquiries and troubleshooting requests.\nAgent1 has the following configurations:\nAgent1 uses a base model deployment.\nA safety evaluation pipeline is NOT enabled.\nTool invocation approval workflows are NOT enabled.\nConversation memory constraints are NOT configured.\nAgent1 interacts with customers by using digital support channels and answers general questions about Contoso products.\nProject1 is deployed to an Azure region located in the European Union (EU).\nAgent1Dev Team will use Project1 to optimize and maintain Agent1.\nProject2 -\nProject2 contains a deployed video generation model. The marketing department at Contoso has access to Project2 and plans to use the model to develop a video creation solution.\nDevelopment of the solution is incomplete.\nData Environment -\nContoso stores product-related information in Azure resources that support AI applications.\nThe Azure environment contains an Azure Blob Storage account named storage1 that stores product detail sheets for all the Contoso products.\nThe product sheets include specifications, feature descriptions, and product support information that Agent1 can use to answer customer questions. The product sheets are stored in the PDF format.\nProblem Statements -\nContoso identifies the following issues:\nAgent1 has only general knowledge of the Contoso products.\nA recent chat interaction with Agent1 was analyzed for sentiment. The results of the analysis have NOT been processed yet.\nAgent1 does NOT use the detailed product information in the product sheets stored in storage1 when responding to customer questions.\nThe finance department at Contoso reports that vendor invoices must be reviewed manually to ensure that the invoices match the terms defined in the vendor contracts. The invoices contain tables, logos, and varied layouts that make the documents difficult to process consistently.\nRequirements -\nPlanned Changes -\nContoso plans to implement the following changes:\nImplement a solution for Project1 that analyzes the vendor invoices by evaluating both the visual layout and the textual content of the invoices, so that the invoice details can be verified against the vendor contract terms.\nUpdate the base model deployment used by Agent1 and standardize the model version to ensure continuity and consistent responses.\nEnable Agent1 to retrieve and use the detailed product information from the product sheets stored in storage1.\nImplement an indexing solution for the product sheets that Agent1 can use to answer customer questions.\nComplete the development of the video creation solution.\nTechnical Requirements -\nContoso identifies the following technical requirements:\nThe model deployment used by Agent1 must support scalable, high-throughput generative AI workloads and dynamically scale to handle variable customer support traffic, without requiring reserved throughput capacity.\nThe product sheets must be processed by using an indexing pipeline that enables semantic and vector search, so that Agent1 can retrieve the relevant product information.\nResponses generated by using the product sheet information must be relevant, complete, and accurate.\nAgent1 must be able to use the product sheets to answer natural language questions about product details.\nThe model version used by Agent1 must remain consistent to ensure stable responses.\nThe data processed by the model must remain within the EU.\nSecurity and Compliance Requirements\nContoso identifies the following security and compliance requirements:\nAPI keys must NOT be used to access Foundry-deployed models.\nAccess to the Azure resources must follow the principle of least privilege.\nThe developers at Contoso must authenticate to Microsoft Foundry resources by using Microsoft Entra authentication.\nAccess to Project1 must be assigned to the members of Agent1Dev Team by using a security group named SC_Agent1_Dev.\nAccess to Project1 must be assigned to the members of Agent1Test Team by using a security group named SC_Agent1_Test.\nAgent1 must never reveal customer information, even if a document that contains customer data is added erroneously to the product sheet repository in storage1.\nThe product sheets might contain images that include embedded text. Agent1 must be protected from malicious instructions potentially hidden within the images.\nBusiness Requirements -\nContoso identifies the following business requirements:\nUsers that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions.\nAgent1 must answer questions only about the products sold by Contoso.\nYou need to configure Agent1 to answer customer questions about only the Contoso products. The solution must meet the business requirements.\nWhat should you do?", "options": [{"key": "A", "text": "Modify the system message instructions."}, {"key": "B", "text": "Add few-shot examples."}, {"key": "C", "text": "Apply top-p sampling."}, {"key": "D", "text": "Increase the value of the temperature parameter."}], "suggestedAnswer": "A", "communityAnswer": "A  [A 1 (100%)]", "images": []}, {"number": 29, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412461-exam-ai-103-topic-1-question-29-discussion/", "content": "You have a Microsoft Foundry project.\nYou plan to build a customer support solution that contains an agent. The solution must meet the following requirements:\nProvide accurate, context-aware responses grounded in internal product documentation stored in Azure AI Search.\nRequire deep, multi-step reasoning across long contexts.\nGenerate detailed natural language responses.\nWhich type of model should you use to power the agent?", "options": [{"key": "A", "text": "a multimodal model"}, {"key": "B", "text": "a small language model (SLM)"}, {"key": "C", "text": "a key phrase extraction model"}, {"key": "D", "text": "a large language model (LLM)"}], "suggestedAnswer": "D", "communityAnswer": "D  [D 1 (100%)]", "images": []}, {"number": 30, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412462-exam-ai-103-topic-1-question-30-discussion/", "content": "DRAG DROP -\nYou have a Microsoft Foundry project that contains a deployed ticket-triage agent.\nYou discover that sometimes the agent responds without calling any tools, even when a tool is required.\nYou need to ensure that the agent calls a tool during execution.\nHow should you complete the Python code? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image23.png"]}, {"number": 31, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412463-exam-ai-103-topic-1-question-31-discussion/", "content": "You are building a web app named App1 that generates responses by using a model deployed to a Microsoft Foundry project named Project1.\nBefore sending the prompts to the model, App1 must retrieve documents by using Azure AI Search.\nYou need to integrate Project1 and App1. The solution must meet the following requirements:\nMultiple client applications must use the same search configuration.\nA security policy must prevent key-based authentication.\nAdministrative effort must be minimized.\nWhat should you do?", "options": [{"key": "A", "text": "Create a custom HTTP connection in Foundry and manually configure Azure AI Search endpoints per application."}, {"key": "B", "text": "Configure an Azure AI Search connection in Project1 and reference the connection in each application."}, {"key": "C", "text": "Call Azure AI Search directly from each application by using Microsoft Entra authentication."}, {"key": "D", "text": "Enable a managed identity for each application and call Azure AI Search directly."}], "suggestedAnswer": "B", "communityAnswer": "B  [B 2 (100%)]", "images": []}, {"number": 32, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412464-exam-ai-103-topic-1-question-32-discussion/", "content": "DRAG DROP -\nYou have a Microsoft Foundry project that contains an agent used by the financial analysts at your company.\nYou need to optimize the agent workflow by providing additional data access and processing capabilities. The solution must meet the following requirements:\nEnsure that the agent can perform calculations during conversations.\nEnsure that the agent can access up-to-date information from public websites.\nEnsure that the agent can retrieve information from documents uploaded directly to the agent.\nWhat should you use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image25.png"]}, {"number": 33, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412465-exam-ai-103-topic-1-question-33-discussion/", "content": "You have a Microsoft Foundry project that contains a prompt agent used by a customer support web app.\nThe agent is invoked from a Python service that does NOT run in the Foundry portal.\nYou need to implement end-to-end tracing to capture latency breakdowns and exceptions across agent runs.\nWhich two components can you use? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.\n\nE. Microsoft Sentinel", "options": [{"key": "A", "text": "a Log Analytics workspace"}, {"key": "B", "text": "Application Insights"}, {"key": "C", "text": "OpenTelemetry"}, {"key": "D", "text": "the Azure Monitor Agent"}], "suggestedAnswer": "BC", "communityAnswer": "BC  [BC 2 (100%)]", "images": []}, {"number": 34, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412466-exam-ai-103-topic-1-question-34-discussion/", "content": "You have a customer support agent that uses the Microsoft Foundry Agent Service.\nSometimes, customers return to a session days later to continue the same support case, and the agent must resume with the full historical context. The agent must provide the following:\nMulti-turn continuity within the session\nCross-session continuity for the same case\nAccess to the full interaction history, including user messages, agent messages, tool calls, and tool outputs\nYou need to ensure that the agent automatically reloads the complete history on each new turn.\nWhat should you do?", "options": [{"key": "A", "text": "Create and reuse a conversation by storing the conversation’s ID and supplying the ID on subsequent requests."}, {"key": "B", "text": "Persist only the final model response stored in the client application and prepend the response to future prompts."}, {"key": "C", "text": "Enable memory summarization on the agent definition to persist the context automatically."}], "suggestedAnswer": "A", "communityAnswer": "A  [A 3 (100%)]", "images": []}, {"number": 35, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412467-exam-ai-103-topic-1-question-35-discussion/", "content": "HOTSPOT -\nYou have a Microsoft Foundry project that contains a deployed chat model.\nYou have a Python service that sends API requests to the model. The service is integrated with an automated validation system that compares generated outputs against approved response patterns.\nStakeholders report that small wording differences are causing validation mismatches.\nYou need to update the request parameters to improve output stability. The solution must maximize reasoning quality.\nHow should you complete the Python code? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image27.png"]}, {"number": 36, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412468-exam-ai-103-topic-1-question-36-discussion/", "content": "You have a chat app in a Microsoft Foundry project and an Azure AI Search vectorized index.\nYou need to connect to the index to meet the following requirements:\nComplex questions must retrieve information from multiple chunks.\nMulti-turn conversations must influence retrieval planning.\nRetrievals must run in parallel to reduce latency.\nWhich retrieval approach should you use?", "options": [{"key": "A", "text": "iterative retrieval"}, {"key": "B", "text": "agentic Retrieval Augmented Generation (RAG)"}, {"key": "C", "text": "chain of thought"}, {"key": "D", "text": "classic Retrieval Augmented Generation (RAG)"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 3 (100%)]", "images": []}, {"number": 37, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412469-exam-ai-103-topic-1-question-37-discussion/", "content": "HOTSPOT -\nYou need to recommend a plan to create a customer support agent by using the Microsoft Foundry Agent Service. The agent must meet the following requirements:\nRetain user preferences across multiple conversations.\nEnable users to provide contextual grounding by directly uploading documents during a chat.\nWhich Foundry capability should you recommend for each requirement? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image29.png"]}, {"number": 38, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412470-exam-ai-103-topic-1-question-38-discussion/", "content": "You have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nYou need to improve response completeness. The solution must be implemented in the logic of the application code before responses are returned.\nWhat should you do?", "options": [{"key": "A", "text": "Add a retry evaluation before the responses are returned."}, {"key": "B", "text": "Decrease the value of the max_tokens parameter."}, {"key": "C", "text": "Switch to Retrieval Augmented Generation (RAG)."}, {"key": "D", "text": "Replace the model with a smaller deployment."}], "suggestedAnswer": "A", "communityAnswer": "A  [A 3 (100%)]", "images": []}, {"number": 39, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412471-exam-ai-103-topic-1-question-39-discussion/", "content": "You have a customer support agent built by using the Microsoft Foundry Agent Service. The agent calls an Azure OpenAI model deployment.\nDuring load testing, calls intermittently fail and return an HTTP 429 rate limit exceeded error.\nYou need to handle throttling to reduce call failures and improve reliability under load. The solution must remain within the service and model limits.\nWhat should you do?", "options": [{"key": "A", "text": "Create a new thread and retry the calls immediately."}, {"key": "B", "text": "Reduce the number of registered tools."}, {"key": "C", "text": "Implement a retry policy that uses exponential backoff and jitter."}, {"key": "D", "text": "Spit uploaded content into smaller files."}], "suggestedAnswer": "C", "communityAnswer": "C  [C 2 (100%)]", "images": []}, {"number": 40, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412472-exam-ai-103-topic-1-question-40-discussion/", "content": "HOTSPOT -\nYou have a Microsoft Foundry project that contains an agent.\nYou use a GitHub Actions workflow for CI/CD.\nYou need to configure the workflow to automatically evaluate the agent when a pull request (PR) is created and prevent branches from merging if the evaluation results do NOT meet the defined thresholds.\nHow should you configure the workflow? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image31.png"]}, {"number": 41, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412473-exam-ai-103-topic-1-question-41-discussion/", "content": "Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nUsers report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content.\nYou need to improve response completeness.\nSolution: You increase the value of the max_tokens parameter.\nDoes this meet the goal?", "options": [{"key": "A", "text": "Yes"}, {"key": "B", "text": "No"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 5 (71%), A 2 (28%)]", "images": []}, {"number": 42, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412474-exam-ai-103-topic-1-question-42-discussion/", "content": "Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nUsers report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content.\nYou need to improve response completeness.\nSolution: You add a reflection pass that regenerates the response if the required clauses are missing.\nDoes this meet the goal?", "options": [{"key": "A", "text": "Yes"}, {"key": "B", "text": "No"}], "suggestedAnswer": "A", "communityAnswer": "A  [A 3 (100%)]", "images": []}, {"number": 43, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412475-exam-ai-103-topic-1-question-43-discussion/", "content": "Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nUsers report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content.\nYou need to improve response completeness.\nSolution: You increase the value of the temperature parameter.\nDoes this meet the goal?", "options": [{"key": "A", "text": "Yes"}, {"key": "B", "text": "No"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 2 (100%)]", "images": []}, {"number": 44, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412476-exam-ai-103-topic-1-question-44-discussion/", "content": "Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem.\nAfter you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen.\nYou have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents.\nUsers report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content.\nYou need to improve response completeness.\nSolution: You run an evaluation flow that scores responses for completeness and blocks responses that fall below a defined threshold.\nDoes this meet the goal?", "options": [{"key": "A", "text": "Yes"}, {"key": "B", "text": "No"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 9 (75%), A 3 (25%)]", "images": []}, {"number": 45, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412477-exam-ai-103-topic-1-question-45-discussion/", "content": "You are creating an image-editing workflow in a Microsoft Foundry project.\nThe workflow must meet the following requirements:\nEnsure that background objects can be removed by applying a mask-based inpainting edit.\nPreserve the original lighting and style of the edited images.\nUse the built-in image editing controls, NOT a custom model.\nYou need to ensure that image edits apply exclusively inside the masked area.\nHow should you configure the workflow?", "options": [{"key": "A", "text": "Set generation mode to image_variation and provide the original image as a reference."}, {"key": "B", "text": "Enable text_to_image mode and a prompt describing the desired background removal."}, {"key": "C", "text": "Enable image_to_image mode and a high-strength value to regenerate the full image based on the prompt."}, {"key": "D", "text": "Enable mask_inpainting and supply both the input image and a mask indicating which part of the image to modify."}], "suggestedAnswer": "D", "communityAnswer": "D  [D 1 (100%)]", "images": []}, {"number": 46, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412478-exam-ai-103-topic-1-question-46-discussion/", "content": "You have a Microsoft Foundry project that generates product marketing images from text prompts.\nAfter publishing several images, the legal team at your company identifies a competitor’s logo on a sign in the background of an image.\nYou need to remove only the logo, while preserving the rest of the image.\nWhat should you do?", "options": [{"key": "A", "text": "Apply a mask-based inpainting edit to the part of the image that contains the logo."}, {"key": "B", "text": "Increase the prompt guidance strength."}, {"key": "C", "text": "Modify the original prompt to exclude brand names."}, {"key": "D", "text": "Rerun the prompt by using a different random seed."}], "suggestedAnswer": "A", "communityAnswer": "A  [A 1 (100%)]", "images": []}, {"number": 47, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412479-exam-ai-103-topic-1-question-47-discussion/", "content": "You have a Microsoft Foundry project that contains an agent.\nThe agent ingests scanned PDF vendor invoices that contain tables and embedded QR codes.\nThe agent must preserve the PDF layout in the extracted output to ensure that downstream processing can reference sections and tables.\nYou plan to call Azure Content Understanding in Foundry Tools.\nYou need to extract content and layout elements and detect QR codes without requiring a language model deployment.\nWhich built-in analyzer should you use?", "options": [{"key": "A", "text": "prebuilt-documentFieldSchema"}, {"key": "B", "text": "prebuilt-read"}, {"key": "C", "text": "prebuilt-documentSearch"}, {"key": "D", "text": "prebuilt-layout"}], "suggestedAnswer": "D", "communityAnswer": "D  [D 1 (100%)]", "images": []}, {"number": 48, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412480-exam-ai-103-topic-1-question-48-discussion/", "content": "You have a Microsoft Foundry project that contains an agent and an image generation model deployment.\nThe agent generates original images from user-supplied product photos.\nYou need to ensure that the generated images maintain the product identity and visual characteristics of the provided photo.\nWhat should you do?", "options": [{"key": "A", "text": "Set the input_fidelity parameter to high."}, {"key": "B", "text": "Apply a groundedness detection filter."}, {"key": "C", "text": "Include a prompt and input image in the request."}, {"key": "D", "text": "Decrease the value of the temperature parameter."}], "suggestedAnswer": "A", "communityAnswer": "A  [A 1 (100%)]", "images": []}, {"number": 49, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412481-exam-ai-103-topic-1-question-49-discussion/", "content": "HOTSPOT -\nYou have a Microsoft Foundry project that contains an agent.\nThe agent accepts user-uploaded screenshots and uses a multimodal chat model.\nSome screenshots contain potentially malicious embedded text.\nYou need to prevent a prompt injection attack and ensure that third-party content is treated as lower trust.\nHow should you configure prompt shields for document attacks? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.", "options": [], "suggestedAnswer": "not shown", "communityAnswer": "no votes", "images": ["https://img.examtopics.com/ai-103/image33.png"]}, {"number": 50, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412482-exam-ai-103-topic-1-question-50-discussion/", "content": "You are deploying a support agent that enables users to upload photos.\nYou need to automatically classify uploaded images for harmful content. The solution must block content based on severity levels.\nWhat should you do?", "options": [{"key": "A", "text": "Apply keyword scanning to optical character recognition (OCR) output by using Azure Vision in Foundry Tools."}, {"key": "B", "text": "Enable prompt shields."}, {"key": "C", "text": "Use blocklists."}, {"key": "D", "text": "Implement image moderation."}], "suggestedAnswer": "D", "communityAnswer": "D  [D 6 (100%)]", "images": []}, {"number": 51, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412483-exam-ai-103-topic-1-question-51-discussion/", "content": "You have an app named App1 that uses a Microsoft Foundry multimodal model deployment.\nApp1 runs optical character recognition (OCR) on uploaded images and appends the OCR output to the prompt as additional context.\nSome uploaded images contain embedded text.\nYou need to prevent potentially malicious instructions from being processed by the model.\nWhat should you use?", "options": [{"key": "A", "text": "image moderation"}, {"key": "B", "text": "prompt shields for documents"}, {"key": "C", "text": "protected material text"}, {"key": "D", "text": "prompt shields for user prompts"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 1 (100%)]", "images": []}, {"number": 52, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412484-exam-ai-103-topic-1-question-52-discussion/", "content": "You have a Microsoft Foundry project that contains an agent.\nYou need to process mixed-format documents that contain scanned text, tables, and multicolumn layouts. The extracted content must preserve the document structure and be converted into the Markdown format for downstream reasoning.\nWhat should you configure first?", "options": [{"key": "A", "text": "an Azure Language in Foundry Tools text analysis model deployment"}, {"key": "B", "text": "a generative chat completion request"}, {"key": "C", "text": "an Azure OpenAI Responses API call that uses a multimodal model"}, {"key": "D", "text": "an Azure Content Understanding in Foundry Tools analyzer"}], "suggestedAnswer": "D", "communityAnswer": "D  [D 2 (100%)]", "images": []}, {"number": 53, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412485-exam-ai-103-topic-1-question-53-discussion/", "content": "You have an application that processes scanned PDF invoices. The invoices have varied layouts and include multipage tables.\nYou have a pipeline that uses optical character recognition (OCR) and extracts totals and invoice numbers. The results are often incorrect because the document structure is ignored.\nYou need to implement a solution that provides OCR, layout analysis, and template-generalizing field extraction. The solution must NOT require training a custom model. The solution must minimize administrative effort.\nWhat should you include in the solution?", "options": [{"key": "A", "text": "Azure Language in Foundry Tools"}, {"key": "B", "text": "Azure Content Understanding in Foundry Tools"}, {"key": "C", "text": "an Azure Machine Learning model"}], "suggestedAnswer": "B", "communityAnswer": "B  [B 3 (100%)]", "images": []}, {"number": 54, "topic": 1, "url": "https://www.examtopics.com/discussions/microsoft/view/412486-exam-ai-103-topic-1-question-54-discussion/", "content": "You have a Microsoft Foundry project that contains an agent.\nThe agent uses a knowledge source built from documents stored in Azure Blob Storage. The documents include digitally scanned PDFs that contain multipage tables.\nYou have an ingestion job that extracts only plain text, causing loss of table structure, headings, and page-number metadata.\nUsers frequently ask questions that require the retrieval of specific table rows across the pages.\nYou need to configure an ingestion job for a Retrieval Augmented Generation (RAG) pipeline that performs optical character recognition (OCR) on scanned PDFs, preserves tables and headings as structure-aware chunks, and stores page-numbe
