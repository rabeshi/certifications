<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-103 Quiz Lab</title><style>body{font:15px system-ui;margin:0;background:#f6f8fb;color:#172033}header{background:#0f172a;color:#fff;padding:16px 22px}h1{margin:0;font-size:20px}header p{margin:3px 0;color:#cbd5e1}.wrap{max-width:1200px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:280px 1fr;gap:18px}.side,.card{background:#fff;border:1px solid #dde3ec;border-radius:14px;padding:16px}.side{align-self:start;position:sticky;top:15px;max-height:90vh;overflow:auto}button{font:inherit}.mode,.nav,.opt,.ctl{border:1px solid #d9e0ea;background:#fff;border-radius:8px;padding:9px;cursor:pointer}.mode.on,.primary{background:#2563eb;color:#fff}.modes{display:flex;gap:8px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav{padding:7px}.miss{color:#98a2b3!important;background:#f2f4f7!important}.visual{border-style:dashed}.good{background:#ecfdf3!important;color:#067647}.bad{background:#fef3f2!important;color:#b42318}.q{white-space:pre-wrap;line-height:1.55;max-height:520px;overflow:auto}.opts{display:grid;gap:9px;margin-top:16px}.opt{text-align:left;padding:12px}.sel{border:2px solid #2563eb;background:#eff6ff}.right{border:2px solid #22c55e;background:#ecfdf3}.wrong{border:2px solid #ef4444;background:#fef3f2}.ans{margin-top:15px;padding:13px;background:#f8fafc;border-radius:10px}.row{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.muted{color:#667085}.stats{font-size:13px;margin:8px 0 12px}@media(max-width:800px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}.grid{grid-template-columns:repeat(10,1fr)}.q{max-height:none}}</style></head><body><header><h1>AI-103 Quiz Lab</h1><p>Learn Mode + Test Mode · 135-question study map</p></header><div class=wrap><aside class=side><div class=modes><button id=learn class=mode>Learn</button><button id=test class=mode>Test</button></div><div id=stats class=stats>Loading…</div><button id=reset class=ctl style="width:100%;margin-bottom:12px">Reset progress</button><div id=nav class=grid></div><p class=muted style="font-size:11px">Solid = scoreable · dashed = visual · gray = not supplied.</p></aside><main id=card class=card>Loading question bank…</main></div><script src="z0.js"></script><script src="z1.js"></script><script src="z2.js"></script><script src="z3.js"></script><script>async function boot(){let bin=Uint8Array.from(atob(Z),c=>c.charCodeAt(0)),ds=new DecompressionStream('deflate'),txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text(),D=JSON.parse(txt),B=new Map(D.map(x=>[x[0],x])),K='ai103v3',s={m:'learn',n:1,a:{}};try{s={...s,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){}const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(s)),score=q=>q&&q[2].length&&/^[A-D]$/.test(q[3]),esc=(x='')=>x.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function nav(){let h='';for(let n=1;n<=135;n++){let q=B.get(n),a=s.a[n],c='nav '+(!q?'miss':score(q)?'':'visual');if(a?.done)c+=' '+(a.ok?'good':'bad');h+=`<button class="${c}" data-n="${n}">${n}</button>`}$('nav').innerHTML=h;$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{s.n=+b.dataset.n;save();render()})}function controls(sub){return `<div class=row><button class=ctl id=prev>← Previous</button>${sub?'<button class="ctl primary" id=submit>Submit</button>':''}<button class=ctl id=next>Next →</button></div>`}function wire(){if($('prev'))$('prev').onclick=()=>go(-1);if($('next'))$('next').onclick=()=>go(1);if($('submit'))$('submit').onclick=()=>{let q=B.get(s.n),a=s.a[s.n];if(!a?.choice)return;a.done=true;a.ok=a.choice===q[3];save();render()}}function go(d){s.n+=d;if(s.n<1)s.n=135;if(s.n>135)s.n=1;save();render()}function render(){nav();$('learn').classList.toggle('on',s.m==='learn');$('test').classList.toggle('on',s.m==='test');let q=B.get(s.n),done=Object.values(s.a).filter(x=>x.done),ok=done.filter(x=>x.ok).length;$('stats').textContent=`75 supplied · 51 scoreable MCQ · ${done.length} answered · ${done.length?Math.round(ok/done.length*100)+'%':'—'} accuracy`;if(!q){$('card').innerHTML=`<h2>Question ${s.n}</h2><p class=muted>Not present in your uploaded source. This slot is intentionally empty rather than invented.</p>${controls()}`;wire();return}let a=s.a[s.n]||{},opts=q[2].map(o=>{let c='opt';if(a.choice===o[0])c+=' sel';if((s.m==='learn'||a.done)&&score(q)&&o[0]===q[3])c+=' right';if(a.done&&a.choice===o[0]&&o[0]!==q[3])c+=' wrong';return `<button class="${c}" data-o="${o[0]}"><b>${o[0]}.</b> ${esc(o[1])}</button>`}).join(''),ans=(s.m==='learn'||a.done)&&score(q)?`<div class=ans><b>Answer: ${q[3]}</b><p class=muted>Answer key shown exactly as supplied in your uploaded source.</p></div>`:(!score(q)?`<div class=ans><b>Visual / interactive item</b><p class=muted>The uploaded text does not contain a machine-readable answer area/key for this item, so it is not auto-scored.</p></div>`:'');$('card').innerHTML=`<div class=muted>Question ${s.n} of 135</div><h2>AI-103 Practice</h2><div class=q>${esc(q[1])}</div><div class=opts>${opts}</div>${ans}${controls(score(q)&&s.m==='test'&&!a.done)}`;$('card').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(s.m==='test'&&a.done)return;s.a[s.n]={...(s.a[s.n]||{}),choice:b.dataset.o};save();render()});wire()}$('learn').onclick=()=>{s.m='learn';save();render()};$('test').onclick=()=>{s.m='test';save();render()};$('reset').onclick=()=>{if(confirm('Reset progress?')){s.a={};save();render()}};render()}boot().catch(e=>document.getElementById('card').textContent='Unable to load quiz data: '+e.message);</script></body></html>
